    <!-- Non-blocking font stylesheet: preload it, then swap its media to "all"
         once loaded, so it never blocks first paint. Both families (Outfit for
         body, Poppins for the hero) are requested in ONE css2 call so the hero
         font starts downloading at parse time instead of after React mounts.
         noscript keeps the render-blocking fallback for JS-off. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap"

      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- LCP element: the hero mockup image is discovered late by the browser
